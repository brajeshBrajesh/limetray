spring.application.name=Food_Order
# ===============================
# Server Config
# ===============================
server.port=8080

# ===============================
# PostgreSQL Config
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/food_order_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# JDBC driver (Spring Boot auto-detects, but we keep it explicit)
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate Config
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Async / ThreadPool Config
# ===============================
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=OrderExecutor-

# ===============================
# Logging
# ===============================
logging.level.org.springframework=INFO
logging.level.com.lime_tray=DEBUG
